# YouTube Summary System Configuration

# LLM provider selection
# Options: "minimax" (default), "openai"
llm:
  provider: "minimax"

# MiniMax API settings (OpenAI-compatible endpoint)
# API key stored in config/.env as MINIMAX_API_KEY
# Available models: MiniMax-M2.7, MiniMax-M2, MiniMax-M1, MiniMax-Text-01
minimax:
  model: "MiniMax-M2.7"
  max_tokens: 4096
  base_url: "https://api.minimax.io/v1"

# OpenAI API settings
# Available models: gpt-4.1-mini, gpt-4.1, gpt-4o-mini, gpt-4o
openai:
  model: "gpt-4.1-mini"
  max_tokens: 4096

# YouTube Data API v3
# API key stored in config/.env as YOUTUBE_API_KEY
# Get one at: https://console.cloud.google.com/ → APIs & Services → Credentials
youtube:
  # Rate limit delay between API calls (seconds)
  request_delay: 0.5

# Transcript extraction settings
transcript:
  # Language preference order (first available will be used)
  # Korean first, then English fallback
  languages:
    - ko
    - en
  # Fall back to any available transcript if preferred not found
  fallback_to_any: true
  # Cookie file for YouTube authentication (bypasses IP bans)
  # Export from browser using a cookie export extension (Netscape/Mozilla format)
  # Path relative to project root, or absolute path
  cookie_file: "config/youtube_cookies.txt"
  # Proxy settings (optional, alternative to cookies)
  # proxy:
  #   http_url: "http://user:pass@proxy:port"
  #   https_url: "http://user:pass@proxy:port"

# Email notification settings
email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  # Sender and recipient configured in .env file

# Scheduling settings
schedule:
  # Daily run time (24-hour format)
  run_time: "23:00"
  # Maximum age of videos to process (in days)
  max_video_age_days: 7
  # Enable catch-up for missed runs
  catch_up_enabled: true

# File paths (relative to project root)
paths:
  summaries_dir: "D:/OneDrive/Information/summaries"
  logs_dir: "logs"
  data_dir: "data"
  state_file: "data/state.json"
  last_run_file: "data/last_run.json"

# Logging settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  max_file_size_mb: 10
  backup_count: 5

# Summary format template
summary_template: |
  ================================================================================
  VIDEO SUMMARY
  ================================================================================

  Title: {title}
  Channel: {channel}
  Published: {published}
  URL: {url}

  --------------------------------------------------------------------------------
  OVERVIEW
  --------------------------------------------------------------------------------
  {overview}

  --------------------------------------------------------------------------------
  KEY POINTS
  --------------------------------------------------------------------------------
  {key_points}

  --------------------------------------------------------------------------------
  NOTABLE QUOTES
  --------------------------------------------------------------------------------
  {quotes}

  --------------------------------------------------------------------------------
  KEY TAKEAWAYS
  --------------------------------------------------------------------------------
  {takeaways}

  ================================================================================
  Generated: {generated_at}
  ================================================================================
